name: 'data_quality_metrics'
version: '1.0.0'

profile: 'data_quality_metrics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  data_quality_metrics:
    postgres:
      +enabled: "{{ target.type == 'postgres' }}"
      +materialized: view
    clickhouse:
      +enabled: "{{ target.type == 'clickhouse' }}"
      +materialized: view
